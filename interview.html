<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Interview Mirror</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b1220;
            color: white;
        }

        header {
            padding: 20px 7%;
            background: #131e30;
            border-bottom: 1px solid #28354a;
        }

        header h2 {
            margin: 0;
            color: #53e6c2;
        }

        header p {
            color: #aab7ca;
            margin-bottom: 0;
        }

        .container {
            width: 90%;
            max-width: 1000px;
            margin: 35px auto;
        }

        .layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .card {
            background: #162237;
            border: 1px solid #293951;
            padding: 22px;
            border-radius: 16px;
        }

        h3 {
            margin-top: 0;
        }

        video {
            width: 100%;
            min-height: 230px;
            background: #050912;
            border-radius: 12px;
            object-fit: cover;
            transform: scaleX(-1);
        }

        button {
            background: #53e6c2;
            color: #0b1220;
            border: none;
            border-radius: 8px;
            padding: 12px 16px;
            margin: 8px 5px 0 0;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .stop {
            background: #ff7777;
        }

        .status {
            color: #aab7ca;
            font-size: 14px;
        }

        .question {
            font-size: 23px;
            line-height: 1.5;
            color: #53e6c2;
        }

        textarea {
            width: 100%;
            height: 130px;
            margin-top: 12px;
            padding: 12px;
            border-radius: 9px;
            border: 1px solid #394a63;
            background: #0b1220;
            color: white;
            font: inherit;
            resize: vertical;
        }

        a {
            color: #53e6c2;
            display: inline-block;
            margin-top: 24px;
        }

        @media (max-width: 700px) {
            .layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h2>Smart Interview Mirror</h2>
        <p>Your personal interview practice space</p>
    </header>

    <main class="container">
        <div class="layout">

            <section class="card">
                <h3>📷 Camera Mirror</h3>

                <video id="camera" autoplay playsinline muted></video>

                <p id="cameraStatus" class="status">
                    Camera is not started.
                </p>

                <button id="startBtn" onclick="startCamera()">
                    Start Camera
                </button>

                <button class="stop" onclick="stopCamera()">
                    Stop Camera
                </button>
            </section>

            <section class="card">
                <h3>🎯 Interview Practice</h3>

                <p class="status">Question 1 of 5</p>

                <div class="question" id="question">
                    Tell me about yourself.
                </div>

                <textarea id="answer"
                    placeholder="Type your answer here..."></textarea>

                <br>

                <button onclick="nextQuestion()">
                    Next Question →
                </button>
                <br>

<button onclick="startVoice()">🎤 Speak Answer</button>

<button onclick="stopVoice()">⏹ Stop Speaking</button>

<button onclick="speakQuestion()">🔊 Hear Question</button>
<button onclick="getFeedback()">🤖 Check My Answer</button>

<div class="card" style="margin-top:20px;">
    <h3>📊 Your Interview Feedback</h3>
    <h2 id="score">--/100</h2>
    <p id="feedback">Your feedback will appear here.</p>
    <ul id="suggestions"></ul>
</div>

<p id="voiceStatus" class="status">
    Voice interview is ready.
</p>
            </section>

        </div>

        <a href="/">← Back to Home</a>
    </main>

    <script>
        let cameraStream = null;

        async function startCamera() {
            const video = document.getElementById("camera");
            const status = document.getElementById("cameraStatus");
            const button = document.getElementById("startBtn");

            if (!navigator.mediaDevices ||
                !navigator.mediaDevices.getUserMedia) {
                status.textContent =
                    "Camera is not supported in this browser.";
                return;
            }

            try {
                cameraStream =
                    await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: false
                    });

                video.srcObject = cameraStream;
                status.textContent = "Camera is running!";
                button.disabled = true;
            } catch (error) {
                status.textContent =
                    "Camera access denied or camera is unavailable.";
            }
        }

        function stopCamera() {
            if (cameraStream) {
                cameraStream.getTracks().forEach(track => track.stop());
                cameraStream = null;
            }

            document.getElementById("camera").srcObject = null;
            document.getElementById("cameraStatus").textContent =
                "Camera is stopped.";

            document.getElementById("startBtn").disabled = false;
        }

        const questions = [
            "Tell me about yourself.",
            "What are your strengths?",
            "What are your weaknesses?",
            "Why should we hire you?",
            "What are your career goals?"
        ];

        let currentQuestion = 0;

        function nextQuestion() {
            currentQuestion =
                (currentQuestion + 1) % questions.length;

            document.getElementById("question").textContent =
                questions[currentQuestion];

            document.getElementById("answer").value = "";

            document.querySelector(".status:not(#cameraStatus)")
                .textContent =
                "Question " + (currentQuestion + 1) +
                " of " + questions.length;
        }
        let recognition = null;

function startVoice() {
    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        document.getElementById("voiceStatus").textContent =
            "Please use Google Chrome for voice interview.";
        return;
    }

    recognition = new SpeechRecognition();
    recognition.lang = "en-IN";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = function () {
        document.getElementById("voiceStatus").textContent =
            "Listening... Speak your answer.";
    };

    recognition.onresult = function (event) {
        const spokenText = event.results[0][0].transcript;
        const answerBox = document.getElementById("answer");

        answerBox.value =
            answerBox.value.trim() ?
            answerBox.value + " " + spokenText :
            spokenText;

        document.getElementById("voiceStatus").textContent =
            "Your answer was converted to text!";
    };

    recognition.onerror = function () {
        document.getElementById("voiceStatus").textContent =
            "Voice error. Check microphone permission and try again.";
    };

    recognition.onend = function () {
        if (document.getElementById("voiceStatus").textContent
            === "Listening... Speak your answer.") {
            document.getElementById("voiceStatus").textContent =
                "Listening stopped.";
        }
    };

    recognition.start();
}

function stopVoice() {
    if (recognition) {
        recognition.stop();
    }

    window.speechSynthesis.cancel();
    document.getElementById("voiceStatus").textContent =
        "Stopped.";
}

function speakQuestion() {
    window.speechSynthesis.cancel();

    const question =
        document.getElementById("question").textContent;

    const speech = new SpeechSynthesisUtterance(question);
    speech.lang = "en-IN";
    speech.rate = 0.9;

    window.speechSynthesis.speak(speech);
}
function getFeedback() {
    const answer = document.getElementById("answer")
        .value.trim();

    const feedback = document.getElementById("feedback");
    const scoreText = document.getElementById("score");
    const suggestions = document.getElementById("suggestions");

    if (answer.length === 0) {
        feedback.textContent = "Please answer the question first.";
        scoreText.textContent = "--/100";
        suggestions.innerHTML = "";
        return;
    }

    const words = answer.split(/\s+/).filter(Boolean);
    let score = 0;
    let tips = [];

    if (words.length >= 50) {
        score += 40;
    } else if (words.length >= 25) {
        score += 30;
    } else if (words.length >= 10) {
        score += 20;
    } else {
        score += 10;
        tips.push("Try giving a more detailed answer.");
    }

    const keywords = [
        "because", "experience", "skill", "learn",
        "team", "goal", "project", "improve",
        "strength", "work", "achieve", "example"
    ];

    const lowerAnswer = answer.toLowerCase();
    const found = keywords.filter(word =>
        lowerAnswer.includes(word)
    ).length;

    score += Math.min(found * 5, 30);

    if (/[.!?]/.test(answer)) {
        score += 10;
    } else {
        tips.push("Use clear, complete sentences.");
    }

    if (words.length >= 15) {
        score += 20;
    }

    score = Math.min(score, 100);

    if (found === 0) {
        tips.push("Add relevant skills, examples, or experience where appropriate.");
    }

    if (words.length < 25) {
        tips.push("Try explaining your answer with a real example.");
    }

    if (tips.length === 0) {
        tips.push("Good effort! Practise speaking clearly and stay relevant to the question.");
    }

    scoreText.textContent = score + "/100";
    feedback.textContent =
        "Practice score based on answer length and basic writing checks. This is not an AI evaluation.";

    suggestions.innerHTML = "";

    tips.forEach(tip => {
        const li = document.createElement("li");
        li.textContent = tip;
        suggestions.appendChild(li);
    });
}
    </script>
</body>
</html>
